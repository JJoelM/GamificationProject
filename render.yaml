services:
  - type: web
    name: gamificacion-pfc-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ENVIRONMENT
        value: production
      - key: AiService__BaseUrl
        value: http://127.0.0.1:8001
      - key: AiService__TokenInterno
        generateValue: true
      - key: JwtSettings__Issuer
        value: GamificacionPFC
      - key: JwtSettings__Audience
        value: GamificacionPFC
      - key: JwtSettings__Secret
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RateLimits__IaPermitLimit
        value: "5"
      - key: RateLimits__IaWindowMinutes
        value: "10"
      - key: ApplyMigrationsOnStartup
        value: "true"
      - key: SeedDemoData
        value: "true"
      - key: SeedDemoPassword
        sync: false
      - key: ProxySecret
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FrontendUrl
        sync: false
