name: CI Pipeline

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend:
    name: Backend (.NET 9 + Tests de Seguridad y Dominio)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore backend/GamificacionBackend.sln

      - name: Compilar
        run: dotnet build backend/GamificacionBackend.sln --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias y de seguridad
        run: dotnet test backend/GamificacionBackend.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (React + Vite + Cloudflare Pages Proxy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis de Cloudflare Pages Function Proxy
        run: node --check functions/api/[[path]].js

      - name: Build de producción
        run: npm run build

      - name: Auditoría anti-filtración de secretos en el bundle compilado
        run: |
          if grep -E "AIza[0-9A-Za-z_-]{35}|TokenInterno|TOKEN_INTERNO|onrender\.com|JwtSettings|Cambiar123|ProxySecret" dist/assets/*.js; then
            echo "::error::Se detectaron posibles secretos, URLs privadas o contraseñas por defecto incrustadas en el bundle de producción."
            exit 1
          fi
          echo "Bundle JS verificado: 0 secretos ni contraseñas por defecto expuestas."

  ai-service:
    name: AI Service (Python FastAPI + Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis y compilación de módulos Python
        run: python -m py_compile main.py contenido.py esquemas.py test_contenido.py

      - name: Ejecutar pruebas unitarias de validación y transformación
        run: python -m unittest -v test_contenido.py

  docker-production:
    name: Docker Unificado de Producción (Render)
    runs-on: ubuntu-latest
    needs: [ backend, ai-service ]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar sintaxis del supervisor start.sh
        run: sh -n start.sh

      - name: Construir imagen Docker unificada (.NET 9 + Python FastAPI)
        run: docker build -t gamificacion-pfc:ci .
